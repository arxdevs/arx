[workspace]
resolver = "2"
members = [
    "crates/arx-core",
    "crates/arx-db",
    "crates/arx-traefik",
    "crates/arx-docker",
    "crates/arx-build",
    "crates/arx-github",
    "crates/arx-server",
    "crates/arx-cli",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arxdevs/arx"
rust-version = "1.85"

[workspace.dependencies]
# arx workspace crates (path deps filled in by each crate as needed)
arx-core = { path = "crates/arx-core" }
arx-db = { path = "crates/arx-db" }
arx-traefik = { path = "crates/arx-traefik" }
arx-docker = { path = "crates/arx-docker" }
arx-build = { path = "crates/arx-build" }
arx-github = { path = "crates/arx-github" }

# Async runtime + ecosystem
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP server / framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono", "uuid"] }

# Docker
bollard = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors
thiserror = "1"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# IDs / time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto (variable encryption, webhook HMAC)
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"

# Atomic file write (Traefik dynamic config)
tempfile = "3"

# SPA embed
rust-embed = "8"

# String matching, helpers
once_cell = "1"
regex = "1"
quick-xml = "0.36"
semver = "1"
globset = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
